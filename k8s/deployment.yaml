apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-uoc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-uoc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web-uoc
    spec:
      containers:
        - name: web-uoc
          image: web-uoc:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
